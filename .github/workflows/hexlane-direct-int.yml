name: hexlane-direct-int

on:
  push:
    branches: [exp/region-epochs]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Nasu726/Python_to_BF_Translator
          ref: exp/hexlane-scalar
          path: translator
      - name: Profile direct int HexLane source size
        env:
          PYTHONPATH: translator/pybf:experiments
        run: |
          mkdir -p results/tmp
          python experiments/profile_direct_int_hexlane_size.py \
            > results/tmp/direct_int_hexlane_size.json
          cat results/tmp/direct_int_hexlane_size.json
      - uses: actions/upload-artifact@v4
        with:
          name: direct-int-hexlane-size
          path: results/tmp/direct_int_hexlane_size.json
      - name: Diagnose HexLane runtime components
        env:
          PYTHONPATH: translator/pybf:experiments
        run: |
          python experiments/diagnose_direct_int_hexlane_runtime.py \
            > results/tmp/direct_int_hexlane_diagnostics.json
          cat results/tmp/direct_int_hexlane_diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: direct-int-hexlane-diagnostics
          path: results/tmp/direct_int_hexlane_diagnostics.json
      - name: Verify direct int HexLane execution
        continue-on-error: true
        env:
          PYTHONPATH: translator/pybf:experiments
        run: |
          python experiments/bench_direct_int_hexlane_pipeline.py \
            > results/tmp/direct_int_hexlane_pipeline.json
          cat results/tmp/direct_int_hexlane_pipeline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-int-hexlane-pipeline
          path: results/tmp/direct_int_hexlane_pipeline.json
          if-no-files-found: ignore
