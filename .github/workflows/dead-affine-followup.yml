name: dead-affine-followup

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify synthetic dead-target rewrites
        run: python experiments/verify_dead_affine_target_opt.py

      - name: Check out compiler main
        uses: actions/checkout@v4
        with:
          repository: Nasu726/Python_to_BF_Translator
          ref: 0851b624364013041faa001db55cf9b90447cdef
          path: translator

      - name: Generate partition artifact
        env:
          PYTHONPATH: translator/pybf
        run: |
          mkdir -p results/tmp
          python - <<'PY'
          from pathlib import Path
          from bfcontestpartition import build_partition_program
          Path('results/tmp/compiler_partition.bf').write_text(build_partition_program(), encoding='ascii')
          PY

      - name: Check out streaming-list compiler branch
        uses: actions/checkout@v4
        with:
          repository: Nasu726/Python_to_BF_Translator
          ref: d3c2eaebe17e1576fedef6e209f4ba82a8fa3bd2
          path: translator_dynamic

      - name: Generate ABC153 streaming artifact
        env:
          PYTHONPATH: translator_dynamic/pybf
        run: |
          python translator_dynamic/tools/bench_tritium_streaming_abc.py \
            --n 8 --pattern mixed \
            --program results/tmp/compiler_abc153_stream.bf \
            --input results/tmp/compiler_abc153_stream.in \
            --expected results/tmp/compiler_abc153_stream.expected

      - name: Check out string-conversion compiler branch
        uses: actions/checkout@v4
        with:
          repository: Nasu726/Python_to_BF_Translator
          ref: 6dcc60c1d38b92be901acc4383a158d254c1ecda
          path: translator_string

      - name: Generate string/conversion artifacts
        env:
          PYTHONPATH: translator_string/pybf
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          from compiler_layout import compile_source

          cases = {
              'char_runtime_store': '''
          chars = list(input())
          i = int(input())
          chars[i] = "X"
          print("".join(chars))
          ''',
              'direct_join_input': '''
          print("".join(list(input())))
          ''',
              'string_to_int': '''
          s = input()
          n = int(s)
          print(n)
          ''',
              'int_to_string': '''
          n = int(input())
          s = str(n)
          print(s)
          ''',
              'direct_int_input': '''
          n = int(input())
          print(n)
          ''',
          }
          for name, source in cases.items():
              Path(f'results/tmp/compiler_{name}.bf').write_text(
                  compile_source(dedent(source)), encoding='ascii'
              )

          inputs = {
              'char_runtime_store': 'abcdef\n3\n',
              'direct_join_input': 'abcdef\n',
              'string_to_int': '123\n',
              'int_to_string': '123\n',
              'direct_int_input': '123\n',
          }
          for name, data in inputs.items():
              Path(f'results/tmp/compiler_{name}.in').write_text(data, encoding='ascii')
          Path('results/tmp/compiler_char_runtime_store.expected').write_text('abcXef\n', encoding='ascii')
          PY

      - name: Measure combined optimizer
        run: |
          python experiments/dead_affine_target_opt.py \
            results/tmp/compiler_partition.bf \
            results/tmp/compiler_abc153_stream.bf \
            results/tmp/compiler_char_runtime_store.bf \
            results/tmp/compiler_direct_join_input.bf \
            results/tmp/compiler_string_to_int.bf \
            results/tmp/compiler_int_to_string.bf \
            results/tmp/compiler_direct_int_input.bf \
            --json > results/tmp/compiler_region_zero_dead_affine.json
          cat results/tmp/compiler_region_zero_dead_affine.json

      - name: Differentially verify partition combined pass
        env:
          PYTHONPATH: translator/pybf
        run: |
          python experiments/verify_compiler_partition.py \
            results/tmp/compiler_partition.bf \
            --optimizer region-zero-dead-affine

      - name: Differentially verify ABC153 combined pass
        env:
          PYTHONPATH: translator_dynamic/pybf
        run: |
          python experiments/verify_external_artifact.py \
            results/tmp/compiler_abc153_stream.bf \
            --input-file results/tmp/compiler_abc153_stream.in \
            --expected-file results/tmp/compiler_abc153_stream.expected \
            --memory-size 300000 \
            --optimizer region-zero-dead-affine

      - name: Differentially verify string/conversion combined pass
        env:
          PYTHONPATH: translator_string/pybf
        run: |
          python experiments/verify_external_artifact.py \
            results/tmp/compiler_char_runtime_store.bf \
            --input-file results/tmp/compiler_char_runtime_store.in \
            --expected-file results/tmp/compiler_char_runtime_store.expected \
            --memory-size 300000 \
            --optimizer region-zero-dead-affine & p1=$!
          python experiments/verify_external_artifact.py \
            results/tmp/compiler_direct_join_input.bf \
            --input-file results/tmp/compiler_direct_join_input.in \
            --memory-size 300000 \
            --optimizer region-zero-dead-affine & p2=$!
          python experiments/verify_external_artifact.py \
            results/tmp/compiler_string_to_int.bf \
            --input-file results/tmp/compiler_string_to_int.in \
            --memory-size 300000 \
            --optimizer region-zero-dead-affine & p3=$!
          python experiments/verify_external_artifact.py \
            results/tmp/compiler_int_to_string.bf \
            --input-file results/tmp/compiler_int_to_string.in \
            --memory-size 300000 \
            --optimizer region-zero-dead-affine & p4=$!
          python experiments/verify_external_artifact.py \
            results/tmp/compiler_direct_int_input.bf \
            --input-file results/tmp/compiler_direct_int_input.in \
            --memory-size 300000 \
            --optimizer region-zero-dead-affine & p5=$!
          wait "$p1"
          wait "$p2"
          wait "$p3"
          wait "$p4"
          wait "$p5"

      - name: Upload combined research outputs
        uses: actions/upload-artifact@v4
        with:
          name: dead-affine-followup
          path: |
            results/tmp/compiler_region_zero_dead_affine.json
            results/tmp/*.region-zero-dead-affine.bf
